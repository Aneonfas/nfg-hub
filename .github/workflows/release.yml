name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build official Windows package
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      tag_commit: ${{ steps.metadata.outputs.tag_commit }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Validate tag and project version
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . ./scripts/release-version.ps1

          if ($env:RELEASE_REF_TYPE -ne 'tag') {
              throw 'The release workflow must run from a tag ref. For a manual run, select the existing tag in the Run workflow branch selector.'
          }

          $version = ConvertFrom-NfgReleaseTag -Tag $env:RELEASE_TAG
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }

          $tagTypeOutput = git cat-file -t "refs/tags/$env:RELEASE_TAG" 2>$null
          $tagType = "$tagTypeOutput".Trim()
          if ($LASTEXITCODE -ne 0 -or $tagType -ne 'tag') {
              throw "Release tag '$env:RELEASE_TAG' must be an annotated tag."
          }

          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $checkedOutCommit) {
              throw "Checked out commit $checkedOutCommit does not match tag commit $tagCommit."
          }
          if ($tagCommit -ne $env:WORKFLOW_COMMIT) {
              throw "Workflow source commit $env:WORKFLOW_COMMIT does not match tag commit $tagCommit."
          }

          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Tag '$env:RELEASE_TAG' does not point to a commit contained in main."
          }

          [xml]$project = Get-Content -LiteralPath './src/Nfg.Store.App/Nfg.Store.App.csproj' -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          $projectVersion = if ($null -eq $versionNode) { '<missing>' } else { $versionNode.InnerText }
          if ($projectVersion -ne $version) {
              throw "Tag version '$version' does not match the Hub project version '$projectVersion'."
          }

          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=nfg-hub-$version-win-x64" >> $env:GITHUB_OUTPUT
          "tag_commit=$tagCommit" >> $env:GITHUB_OUTPUT

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build release package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./scripts/build-release.ps1 `
              -Version $env:RELEASE_VERSION `
              -RuntimeIdentifier win-x64 `
              -OutputRoot '${{ runner.temp }}\nfg-hub-release' `
              -TestStartup `
              -RemovePublishDirectory

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}\nfg-hub-release\NFG-Hub-v${{ steps.metadata.outputs.version }}-win-x64.zip

      - name: Upload verified package between jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}\nfg-hub-release\NFG-Hub-v${{ steps.metadata.outputs.version }}-win-x64.zip
            ${{ runner.temp }}\nfg-hub-release\NFG-Hub-v${{ steps.metadata.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft-release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/nfg-hub-release

      - name: Verify downloaded checksum
        shell: bash
        working-directory: ${{ runner.temp }}/nfg-hub-release
        run: sha256sum --check "NFG-Hub-v${{ needs.build.outputs.version }}-win-x64.zip.sha256"

      - name: Verify package provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh attestation verify \
            "${{ runner.temp }}/nfg-hub-release/NFG-Hub-v${{ needs.build.outputs.version }}-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --source-digest "${{ needs.build.outputs.tag_commit }}" \
            --deny-self-hosted-runners

      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.tag_commit }}
          RELEASE_ROOT: ${{ runner.temp }}/nfg-hub-release
        run: |
          set -euo pipefail

          zip_path="$RELEASE_ROOT/NFG-Hub-v$RELEASE_VERSION-win-x64.zip"
          checksum_path="$zip_path.sha256"

          current_tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$current_tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG moved from $RELEASE_COMMIT to $current_tag_commit; refusing to publish." >&2
            exit 1
          fi

          zip_name=$(basename "$zip_path")
          checksum_name=$(basename "$checksum_path")
          api_error=$(mktemp)
          if release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>"$api_error"); then
            rm -f "$api_error"
            api_error=''
            release_is_draft=$(jq -r '.draft' <<<"$release_json")
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi

            asset_count=$(jq '.assets | length' <<<"$release_json")
            expected_asset_count=$(jq --arg zip "$zip_name" --arg checksum "$checksum_name" \
              '[.assets[] | select(.name == $zip or .name == $checksum)] | length' <<<"$release_json")

            if [[ "$asset_count" -ne 0 && \
                  ( "$asset_count" -ne 2 || "$expected_asset_count" -ne 2 ) ]]; then
              echo "Draft $RELEASE_TAG contains unexpected, missing, or duplicate assets; delete the draft and rerun." >&2
              exit 1
            fi

            if [[ "$asset_count" -eq 2 ]]; then
              zip_asset_digest=$(jq -r --arg name "$zip_name" \
                '[.assets[] | select(.name == $name) | .digest][0] // empty' <<<"$release_json")
              checksum_asset_digest=$(jq -r --arg name "$checksum_name" \
                '[.assets[] | select(.name == $name) | .digest][0] // empty' <<<"$release_json")
              if [[ -z "$zip_asset_digest" || -z "$checksum_asset_digest" ]]; then
                echo "GitHub did not provide digests for existing draft assets; refusing unsafe reuse." >&2
                exit 1
              fi

              expected_zip_digest="sha256:$(cut -d' ' -f1 "$checksum_path")"
              expected_checksum_digest="sha256:$(sha256sum "$checksum_path" | cut -d' ' -f1)"
              if [[ "$zip_asset_digest" != "$expected_zip_digest" || \
                    "$checksum_asset_digest" != "$expected_checksum_digest" ]]; then
                echo "Draft $RELEASE_TAG already contains different bytes; use a new version or delete the draft after review." >&2
                exit 1
              fi

              echo "Draft $RELEASE_TAG already contains the identical verified assets."
            else
              gh release upload "$RELEASE_TAG" \
                "$zip_path#Portable Windows x64" \
                "$checksum_path#SHA-256 checksum" \
                --repo "$GITHUB_REPOSITORY"
            fi
          elif grep -q 'HTTP 404' "$api_error"; then
            rm -f "$api_error"
            api_error=''
            gh release create "$RELEASE_TAG" \
              "$zip_path#Portable Windows x64" \
              "$checksum_path#SHA-256 checksum" \
              --draft \
              --generate-notes \
              --title "NFG Hub $RELEASE_VERSION" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          else
            cat "$api_error" >&2
            exit 1
          fi

          if [[ -n "${api_error:-}" ]]; then rm -f "$api_error"; fi

          echo "A draft release is ready for manual review and publication."
